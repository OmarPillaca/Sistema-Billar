<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas · Sistema de Billar</title>

    <!-- Aplicación temprana del tema (evita parpadeo al abrir) -->
    <script>
        (function () {
            try {
                var cfg = JSON.parse(localStorage.getItem('billar:config') || '{}');
                var tema = cfg && cfg.tema;
                if (tema !== 'oscuro' && tema !== 'claro') {
                    tema = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                        ? 'oscuro' : 'claro';
                }
                document.documentElement.setAttribute('data-theme', tema);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'claro');
            }
        })();
    </script>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/themes.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="mesas.css">
</head>
<body data-page="mesas" data-base="../../">
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <main id="main" class="main">
        <div class="page">
            <header class="page__header">
                <div>
                    <h1 class="page__title">Mesas</h1>
                    <p class="page__subtitle" id="mesas-subtitle">Cargando mesas…</p>
                </div>
                <div class="page__actions">
                    <button type="button" class="btn btn--primary" id="btn-nueva-mesa">＋ Nueva mesa</button>
                </div>
            </header>

            <div class="cards-grid" id="mesas-grid"></div>

            <div class="empty-state hidden" id="mesas-vacio">
                <div class="empty-state__icon" aria-hidden="true">🎱</div>
                <p class="empty-state__title">No hay mesas registradas</p>
                <p class="empty-state__text">Crea tu primera mesa con el botón “Nueva mesa” para empezar a operar.</p>
            </div>
        </div>
    </main>

    <script type="module" src="mesas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes · Sistema de Billar</title>

    <!-- Aplicación temprana del tema (evita parpadeo al abrir) -->
    <script>
        (function () {
            try {
                var cfg = JSON.parse(localStorage.getItem('billar:config') || '{}');
                var tema = cfg && cfg.tema;
                if (tema !== 'oscuro' && tema !== 'claro') {
                    tema = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                        ? 'oscuro' : 'claro';
                }
                document.documentElement.setAttribute('data-theme', tema);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'claro');
            }
        })();
    </script>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/themes.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="reportes.css">
</head>
<body data-page="reportes" data-base="../../">
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <main id="main" class="main">
        <div class="page">
            <header class="page__header">
                <div>
                    <h1 class="page__title">Reportes</h1>
                    <p class="page__subtitle" id="reportes-subtitle">Cargando datos…</p>
                </div>
                <div class="page__actions">
                    <div class="segmented" id="rangos-rapidos" role="group" aria-label="Rangos rápidos">
                        <button type="button" data-rango="hoy">Hoy</button>
                        <button type="button" data-rango="7d" class="active" aria-pressed="true">7 días</button>
                        <button type="button" data-rango="mes">Este mes</button>
                        <button type="button" data-rango="todo">Todo</button>
                    </div>
                </div>
            </header>

            <div class="filters-bar">
                <div class="form-group">
                    <label class="form-label" for="rango-desde">Desde</label>
                    <input class="form-input" id="rango-desde" type="date">
                </div>
                <div class="form-group">
                    <label class="form-label" for="rango-hasta">Hasta</label>
                    <input class="form-input" id="rango-hasta" type="date">
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card stat-card--success">
                    <span class="stat-card__label">Ingresos</span>
                    <span class="stat-card__value" id="stat-ingresos">S/ 0.00</span>
                </div>
                <div class="stat-card stat-card--danger">
                    <span class="stat-card__label">Gastos</span>
                    <span class="stat-card__value" id="stat-gastos">S/ 0.00</span>
                </div>
                <div class="stat-card stat-card--info">
                    <span class="stat-card__label">Utilidad</span>
                    <span class="stat-card__value" id="stat-utilidad">S/ 0.00</span>
                </div>
                <div class="stat-card stat-card--warning">
                    <span class="stat-card__label">Sesiones cobradas</span>
                    <span class="stat-card__value" id="stat-sesiones">0</span>
                </div>
            </div>

            <div class="charts-grid">
                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Ingresos por día</h2>
                    </header>
                    <div class="card__body"><div class="chart" id="chart-ingresos"></div></div>
                </section>

                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Ingresos por método de pago</h2>
                    </header>
                    <div class="card__body"><div class="chart" id="chart-metodos"></div></div>
                </section>

                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Gastos por categoría</h2>
                    </header>
                    <div class="card__body"><div class="chart" id="chart-gastos-cat"></div></div>
                </section>

                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Gastos por día</h2>
                    </header>
                    <div class="card__body"><div class="chart" id="chart-gastos-dia"></div></div>
                </section>

                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Productos más vendidos</h2>
                    </header>
                    <div class="card__body"><div class="chart" id="chart-top"></div></div>
                </section>

                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Sesiones por hora de inicio</h2>
                    </header>
                    <div class="card__body"><div class="chart" id="chart-horas"></div></div>
                </section>
            </div>
        </div>
    </main>

    <script type="module" src="reportes.js"></script>
</body>
</html>
